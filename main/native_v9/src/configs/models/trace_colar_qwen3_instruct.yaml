seed: ~

model:
  target: src.models.trace_colar.LitTRACECoLaR
  model_kwargs:
    model_id: Qwen3-4B-Instruct
    llm_path: ${oc.env:TRACE_MODEL_PATH}
    sft_method: colar
    chat_template: False
    trust_remote_code: False
    torch_dtype: bfloat16
    attn_implementation: ~

    do_lora: True
    lora_config:
      r: 64
      lora_alpha: 32
      target_modules:
        - q_proj
        - k_proj
        - v_proj
        - o_proj
        - gate_proj
        - up_proj
        - down_proj

    latent_cot_config:
      ce_weight: 1
      embed_modeling_weight: 1
      embed_modeling_loss: mse
      entropy_weight: 0
      pred_embed_forward_weight: 0
      max_compression_factor: 5
      pred_compressed_cot: True
      sqrt_mean: True

    latent_policy_config:
      lp_determinisitc: False
      lp_intermediate_size: 2048

    latent_generation_config:
      max_n_latent_forward: 64
      min_n_latent_forward: 0
      latent_temperature: 1.0
      eol_temperature: 1.0
      compression_factor: 5

    answer_generation_config:
      max_new_tokens: 16
      do_sample: False

    do_rl: False
    rl_config:
      average_per_token_loss: False
      random_speed_in_group: False
      filter_dataset: False
      exp_batch_size: 8
      group_size: 8
      punish_latent_length: False
      clip_grad_norm: 1.0
      clip_eps: 0.2
      use_latent_loss: True
      use_answer_loss: True
      n_train_samples_per_epoch: 512

    trace_config:
      enable_trace_reward: False
      trace_reward_weight: 0.1
      pos_neg_weight: 1.0
      hard_neg_weight: 1.0
      pos_pos_diversity_weight: 0.2
      pos_agreement_weight: 0.1
      hard_negative_top_frac: 0.5
      trace_center_trajectories: False
      trace_filter_mixed_train_indices: False
      trace_filter_candidate_factor: 1.0
      trace_filter_candidate_count: 0
      trace_filter_batch_size: 1
      trace_filter_stop_when_full: True
      trace_filter_mixed_fill_fraction: 0.5
      trace_resample_mixed_rollout: False
      trace_resample_mixed_max_attempts: 4
      trace_resample_mixed_target_frac: 1.0

  training_kwargs:
    optimizer:
      target: torch.optim.AdamW
      lr: 3e-5
      weight_decay: 0.01
      foreach: False
    use_scheduler: False
    scheduler:
      target: constant_schedule_with_warmup
      warmup_steps: 1000

trainer:
  max_epochs: 3

dataloader:
  batch_size: 1
  val_batch_size: 1
  num_workers: 4
  pin_memory: True
  persistent_workers: False
